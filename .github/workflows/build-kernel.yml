name: build kernel
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  KBUILD_BUILD_USER: deepin-kernel-sig
  KBUILD_BUILD_HOST: deepin-kernel-builder
  email: support@deepin.org

permissions:
  pull-requests: read

jobs:
  build-x86-kernel:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v3
      - name: "Install Deps"
        run: |
          git config --global user.email $email
          git config --global user.name $KBUILD_BUILD_USER

      - name: "Compile kernel"
        run: |
          rm ../*.deb ../*.buildinfo ../*.changes 
          # .config
          make clean
          make mrproper
          make deepin_x86_desktop_defconfig
          make bindeb-pkg -j$(nproc)

  build-arm64-kernel:
    runs-on: [self-hosted, linux, ARM64]
    steps:
      - uses: actions/checkout@v3
      - name: "Install Deps"
        run: |
          git config --global user.email $email
          git config --global user.name $KBUILD_BUILD_USER

      - name: "Compile kernel"
        run: |
          rm ../*.deb ../*.buildinfo ../*.changes 
          make clean
          make mrproper
          # .config
          make deepin_arm64_desktop_defconfig
          make bindeb-pkg -j$(nproc)
